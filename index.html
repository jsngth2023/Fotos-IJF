<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos IJF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #000;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .container img {
            width: auto;
            height: auto;
            max-width: 100%;
 
        }

    </style>
</head>
<body>
    <h1>fotos em breve</h1>
    <div class="container" id="container"></div>

    <script>
const galeria = document.getElementById("container");

for (let i = 1; i <= 20; i++) {
    const img = document.createElement("img");

    img.src = `fotos/(${i}).jpeg`;
    img.alt = `(${i}).jpeg`;

    galeria.appendChild(img);
}
</script>
</body>
</html>
